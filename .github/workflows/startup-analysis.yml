name: startup analysis
on:
  push:
    branches: [perf/startup-analysis]
    paths: [diagnostics/startup/**, .github/workflows/startup-analysis.yml]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: latest
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang strace binutils
      - run: npm ci
      - run: python3 diagnostics/startup/prepare.py
      - run: node diagnostics/startup/measure.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-analysis-linux
          path: results/startup/**
