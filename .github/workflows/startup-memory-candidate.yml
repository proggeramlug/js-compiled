name: startup memory candidate
on:
  push:
    branches: [perf/startup-verification]
    paths:
      - .github/workflows/startup-memory-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: PerryTS/perry
          ref: 603b074ace01464bc66fc07cc8d532f26ccf5a0f
          path: .startup-baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: proggeramlug/perry
          ref: 55a29934b1f1fd6dd1ce9f47e9f4d9b71286a04c
          path: .startup-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.1'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libssl-dev pkg-config
      - run: npm ci
      - uses: ./.startup-baseline/.github/actions/setup-llvm22
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal
      - id: builds
        run: python3 diagnostics/startup/build-candidate.py .startup-baseline .startup-candidate results/memory-candidate
      - run: python3 diagnostics/startup/prepare-memory-profile.py results/memory-candidate
      - run: node diagnostics/startup/prepare-comparison.mjs results/memory-candidate/startup results/memory-candidate/startup-config.json
      - run: node diagnostics/startup/prepare-comparison.mjs results/memory-candidate/workloads results/memory-candidate/workloads-config.json
      - run: node diagnostics/startup/prepare-comparison.mjs results/memory-candidate/small-startup results/memory-candidate/small-startup-config.json
      - run: node diagnostics/startup/prepare-comparison.mjs results/memory-candidate/small-workloads results/memory-candidate/small-workloads-config.json
      - run: node diagnostics/startup/compare.mjs results/memory-candidate/startup/manifest.json results/memory-candidate/startup/measurements.json
      - run: node diagnostics/startup/compare.mjs results/memory-candidate/small-startup/manifest.json results/memory-candidate/small-startup/measurements.json
      - run: node diagnostics/startup/verify-workloads.mjs results/memory-candidate/workloads/manifest.json results/memory-candidate/workloads/verification.json
      - if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        run: node diagnostics/startup/verify-workloads.mjs results/memory-candidate/small-workloads/manifest.json results/memory-candidate/small-workloads/verification.json --record-profile-tradeoffs
      - name: Native Rust allocator policy test
        if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        working-directory: .startup-candidate
        env:
          RUST_TEST_THREADS: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/results/memory-candidate/cargo-target
        run: |
          for mode in normal small override; do
            case "$mode" in
              normal) unset PERRY_MEMORY_PROFILE MIMALLOC_ALLOW_THP ;;
              small) export PERRY_MEMORY_PROFILE=small; unset MIMALLOC_ALLOW_THP ;;
              override) export PERRY_MEMORY_PROFILE=small MIMALLOC_ALLOW_THP=1 ;;
            esac
            cargo test --locked --profile perry-dev --lib -p perry-runtime -- startup_memory_profile::linux::tests::allocator_policy_is_selected_before_gc_init --exact --test-threads=1 > "../results/memory-candidate/policy-${mode}-test.log" 2>&1 || exit $?
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-candidate-${{ matrix.os }}
          path: |
            results/memory-candidate/**/*.json
            results/memory-candidate/**/*.log
            !results/memory-candidate/cargo-target/**
